name: Rust and native OCR
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: bash scripts/check-embedded-ocr.sh target/debug/nebula-paste
