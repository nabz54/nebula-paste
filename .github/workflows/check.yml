name: Rust and native OCR
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev desktop-file-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt && rustup default 1.93.0
      - run: desktop-file-validate resources/*.desktop
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: bash scripts/check-embedded-ocr.sh target/debug/nebula-paste
  publish-beta:
    name: Publish tested beta sources
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nebula-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bilingual release notes
        id: release
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert '-beta.' in version
          sections = []
          for name in ['CHANGELOG.fr.md', 'CHANGELOG.md']:
              text = pathlib.Path(name).read_text()
              section = text.split('## ' + version + ' ', 1)[1].split('\n## ', 1)[0]
              sections.append('## ' + version + ' ' + section.strip())
          pathlib.Path('release-notes.md').write_text('\n\n'.join(sections) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving it."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title "Nebula Paste $RELEASE_TAG" --notes-file release-notes.md
          fi
