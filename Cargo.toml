[package]
name = "nebula-paste"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
description = "Un presse-papiers visuel natif pour le bureau COSMIC"

[dependencies]
# The exact libcosmic commit is pinned in Cargo.lock; build with --locked.
# Share the same Git source as cosmic-panel so cargo vendor can deduplicate it.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "tokio", "wayland", "multi-window", "x11", "xdg-portal"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
wl-clipboard-rs = "0.9.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
